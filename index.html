
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Electronic Case Management</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef2f7;
      font-family: Arial, sans-serif;
      color: #243449;
      padding: 20px;
    }

    .login-card {
      background: white;
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 8px 35px rgba(20, 40, 70, 0.09);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: 25px;
      margin-bottom: 9px;
    }

    .brand p {
      color: #718096;
      font-size: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 18px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #4778b8;
      border-color: #4778b8;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 6px;
      padding: 14px;
      font-size: 15px;
    }

    .login-button {
      width: 100%;
      margin-top: 25px;
      background: #244c78;
      color: white;
      font-weight: bold;
    }

    .login-button:hover {
      background: #193957;
    }

    .message {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.5;
      color: #64748b;
      text-align: center;
    }

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #8994a3;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <h1>Electronic Case Management</h1>
      <p>Staff access portal</p>
    </div>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button class="login-button" type="submit">
        Sign in
      </button>
    </form>

    <p class="message" id="message">
      Sign-in services are being configured.
    </p>

    <div class="footer">
      Authorised staff access only
    </div>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Login is not connected yet. Please wait for account setup.";
    });
  </script>
</body>
</html>
