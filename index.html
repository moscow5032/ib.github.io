<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Management (Training System)</title>
<style>
  :root {
    --bg: #eef1f5; --card: #ffffff; --text: #1b2430; --muted: #5b6776;
    --line: #d5dbe3; --accent: #1f3a5f; --accent-text: #ffffff; --error: #a4262c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141a22; --card: #1d2530; --text: #e8edf3; --muted: #9aa7b6;
      --line: #33404f; --accent: #6f9bd1; --accent-text: #0d1620; --error: #ff8a8f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.5; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 24px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input { width: 100%; padding: 10px 12px; font: inherit; color: var(--text);
          background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border: 0; border-radius: 6px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; margin-top: 18px; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); margin-top: 0; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { color: var(--error); min-height: 1.4em; margin: 12px 0 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 20px; }
  .who { color: var(--muted); font-size: .9rem; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: .9rem; }
  .scroll { overflow-x: auto; }
  .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
  @media (max-width: 520px) { .grid { grid-template-columns: 1fr; } }
  .hidden { display: none; }
  .notice { font-size: .85rem; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<main>

  <!-- LOGIN -->
  <section id="login-view" class="card" style="max-width:420px;margin:8vh auto 0;">
    <h1>Case Management</h1>
    <p class="sub">Training system. Fictional data only.</p>
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button id="login-btn" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <!-- APP -->
  <section id="app-view" class="hidden">
    <div class="bar">
      <div>
        <h1>Cases</h1>
        <div id="who" class="who"></div>
      </div>
      <button id="logout-btn" class="secondary" type="button">Sign out</button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <h2>Open a new case</h2>
      <form id="case-form">
        <div class="grid">
          <div>
            <label for="case-number">Case number</label>
            <input id="case-number" required placeholder="2026-0001">
          </div>
          <div>
            <label for="case-title">Title</label>
            <input id="case-title" required placeholder="Fictional burglary, High Street">
          </div>
        </div>
        <button type="submit">Create case</button>
        <p id="case-error" class="error" role="alert"></p>
      </form>
    </div>

    <div class="card">
      <h2>Your cases</h2>
      <div class="scroll">
        <table>
          <thead><tr><th>Number</th><th>Title</th><th>Status</th><th>Opened</th></tr></thead>
          <tbody id="case-rows"></tbody>
        </table>
      </div>
      <p id="empty" class="notice hidden">No cases yet. Create one above.</p>
    </div>
  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // ====== EDIT THESE THREE LINES ======
  const SUPABASE_URL = 'https://oqdbxvnvoonmpweqfbog.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_ZfKpRtfUsTAN_JNAjgMROA_danvuGsW';   // anon key ONLY. Never the service_role key.
  const EMAIL_DOMAIN = 'example.com';                    // must match the fake emails you created users with
  // ====================================

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const $ = (id) => document.getElementById(id);
  const loginView = $('login-view'), appView = $('app-view');

  function show(loggedIn) {
    loginView.classList.toggle('hidden', loggedIn);
    appView.classList.toggle('hidden', !loggedIn);
  }

  // Turn "jsmith" into "jsmith@example.com" so people only ever see a username.
  function toEmail(username) {
    return username.trim().toLowerCase() + '@' + EMAIL_DOMAIN;
  }

  $('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('login-error').textContent = '';
    $('login-btn').disabled = true;
    const { error } = await db.auth.signInWithPassword({
      email: toEmail($('username').value),
      password: $('password').value
    });
    $('login-btn').disabled = false;
    if (error) {
      // Same message whatever went wrong, so it doesn't reveal which usernames exist.
      $('login-error').textContent = 'Username or password is incorrect.';
      return;
    }
    $('password').value = '';
    await startApp();
  });

  $('logout-btn').addEventListener('click', async () => {
    await db.auth.signOut();
    show(false);
  });

  async function startApp() {
    const { data: userData } = await db.auth.getUser();
    if (!userData || !userData.user) { show(false); return; }

    const { data: profile } = await db.from('profiles')
      .select('username, role, active').eq('id', userData.user.id).single();

    if (!profile || !profile.active) {
      await db.auth.signOut();
      $('login-error').textContent = 'This account has no access. Ask an administrator.';
      show(false);
      return;
    }
    $('who').textContent = 'Signed in as ' + profile.username + ' (' + profile.role + ')';
    show(true);
    await loadCases();
  }

  async function loadCases() {
    const { data, error } = await db.from('cases')
      .select('case_number, title, status, created_at')
      .order('created_at', { ascending: false });
    const body = $('case-rows');
    body.replaceChildren();
    if (error) { $('case-error').textContent = 'Could not load cases.'; return; }
    $('empty').classList.toggle('hidden', data.length > 0);
    for (const c of data) {
      const tr = document.createElement('tr');
      // textContent (not innerHTML) so typed text can never run as code
      for (const value of [c.case_number, c.title, c.status, new Date(c.created_at).toLocaleDateString('en-GB')]) {
        const td = document.createElement('td');
        td.textContent = value;
        tr.appendChild(td);
      }
      body.appendChild(tr);
    }
  }

  $('case-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('case-error').textContent = '';
    const { error } = await db.from('cases').insert({
      case_number: $('case-number').value.trim(),
      title: $('case-title').value.trim()
    });
    if (error) {
      $('case-error').textContent = error.code === '23505'
        ? 'That case number already exists.'
        : 'Could not create the case.';
      return;
    }
    $('case-form').reset();
    await loadCases();
  });

  // If the person already has a valid session (page refresh), skip the login screen.
  db.auth.getSession().then(({ data }) => { if (data.session) startApp(); });
</script>
</body>
</html>
